plugins {
    id 'io.micronaut.build.internal.runner-module'
}

description = 'Shared packaging logic used by the Micronaut Runner Gradle and Maven plugins'

// The launcher is bundled as a resource, not as a classpath dependency of user builds. A resolvable
// configuration selecting the JAR variant carries the task dependency on :micronaut-runner-launcher:jar
// without reaching into another project's task container.
configurations {
    launcher {
        canBeResolved = false
        canBeConsumed = false
    }
    launcherJar {
        canBeResolved = true
        canBeConsumed = false
        extendsFrom launcher
        attributes {
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
        }
    }
}

dependencies {
    // Shares the index reader and ZIP primitives with the launcher (which has no dependencies of its own).
    api projects.micronautRunnerLauncher
    launcher projects.micronautRunnerLauncher

    // Only for io.micronaut.core.annotation.Internal, which japicmp's rules read from the class files. It is
    // compileOnly, so neither micronaut-core nor its BOM reaches the published POM.
    compileOnly platform(libs.micronaut.core)
    compileOnly 'io.micronaut:micronaut-core'

    // micronaut-core is only needed by the service-discovery tests, never at packaging runtime.
    testImplementation platform(libs.micronaut.core)
    testImplementation 'io.micronaut:micronaut-inject'
}

// The transform corpus runs the class transform pipeline over the class paths of real applications, which
// only the "Transform corpus" workflow resolves: it is not part of check.
tasks.named('test', Test) {
    useJUnitPlatform { excludeTags 'transform-corpus' }
}

abstract class TransformCorpusArguments implements CommandLineArgumentProvider {
    /** The directory of class-path files, one per application; each file lists jars that are read. */
    @Input
    abstract Property<String> getCorpus()

    @Override
    Iterable<String> asArguments() {
        ["-Drunner.transformCorpus=${corpus.get()}".toString()]
    }
}

tasks.register('transformCorpusTest', Test) {
    group = 'verification'
    description = 'Runs the class transform pipeline over the class paths named by -Prunner.transformCorpus=<dir>'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'transform-corpus' }
    def arguments = objects.newInstance(TransformCorpusArguments)
    arguments.corpus.set(providers.gradleProperty('runner.transformCorpus').orElse(''))
    jvmArgumentProviders.add(arguments)
    // The jars the class paths name are not inputs Gradle can see, so the result is never reused.
    outputs.upToDateWhen { false }
    testLogging.showStandardStreams = true
}

tasks.named('processResources', ProcessResources) {
    from(configurations.launcherJar) {
        into 'META-INF/micronaut-runner'
        rename { 'launcher.jar' }
    }
}
