plugins {
    id 'io.micronaut.build.internal.runner-module'
}

description = 'Shared packaging logic used by the Micronaut Runner Gradle and Maven plugins'

// The launcher is bundled as a resource, not as a classpath dependency of user builds. A resolvable
// configuration selecting the JAR variant carries the task dependency on :micronaut-runner-launcher:jar
// without reaching into another project's task container.
configurations {
    launcher {
        canBeResolved = false
        canBeConsumed = false
    }
    launcherJar {
        canBeResolved = true
        canBeConsumed = false
        extendsFrom launcher
        attributes {
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
        }
    }
    // micronaut-inject 5.1.x and what it links against: the dependencies of the fixture applications that the
    // static service table tests package. They reach the tests as files and never join a class path.
    micronautCore51 {
        canBeResolved = true
        canBeConsumed = false
    }
}

// The Logback front end of LogbackPrecompiler, and the JoranFallback class it copies into runner jars. It is
// compiled against Logback but never put on this library's class path: it ships as a jar resource, like the
// launcher, and runs only in an isolated class loader next to the application's own Logback jars. So the main
// code has no Logback dependency and the published POM does not change.
//
// The same goes for the classes StaticServiceTableGenerator copies into an application that gets a static
// service table: compiled against micronaut-core, shipped as a jar resource, never on this library's class path.
sourceSets {
    logbackFrontend
    staticServices
}

dependencies {
    // Shares the index reader and ZIP primitives with the launcher (which has no dependencies of its own).
    api projects.micronautRunnerLauncher
    launcher projects.micronautRunnerLauncher

    // Only for io.micronaut.core.annotation.Internal, which japicmp's rules read from the class files. It is
    // compileOnly, so neither micronaut-core nor its BOM reaches the published POM.
    compileOnly platform(libs.micronaut.core)
    compileOnly 'io.micronaut:micronaut-core'

    logbackFrontendCompileOnly libs.logback.classic
    // The line of micronaut-core the table serves.
    staticServicesCompileOnly "io.micronaut:micronaut-core:${libs.versions.micronaut.core51.get()}"
    micronautCore51 "io.micronaut:micronaut-inject:${libs.versions.micronaut.core51.get()}"

    // micronaut-core is only needed by the service-discovery tests, never at packaging runtime.
    testImplementation platform(libs.micronaut.core)
    testImplementation 'io.micronaut:micronaut-inject'
    // The differential tests of LogbackPrecompiler configure Logback with Joran and with the generated classes.
    testImplementation libs.logback.classic
}

tasks.withType(Test).configureEach {
    def micronautCore51 = configurations.micronautCore51
    inputs.files(micronautCore51).withPropertyName('micronautCore51').withNormalizer(ClasspathNormalizer)
    jvmArgumentProviders.add({ ->
        ["-Drunner.test.micronautCore51=${micronautCore51.asPath}".toString()]
    } as CommandLineArgumentProvider)
}

tasks.named('compileLogbackFrontendJava', JavaCompile) {
    options.release = 25
    // JoranFallback is copied into applications verbatim: no invokedynamic string concatenation in it.
    options.compilerArgs.addAll(['-XDstringConcat=inline'])
}

def logbackFrontendJar = tasks.register('logbackFrontendJar', Jar) {
    description = 'Packages the Logback front end that runner-build carries as a resource'
    archiveFileName = 'logback-frontend.jar'
    destinationDirectory = layout.buildDirectory.dir('logback-frontend')
    from sourceSets.logbackFrontend.output
}

// The transform corpus runs the class transform pipeline over the class paths of real applications, which
// only the "Transform corpus" workflow resolves: it is not part of check.
tasks.named('test', Test) {
    useJUnitPlatform { excludeTags 'transform-corpus' }
}

abstract class TransformCorpusArguments implements CommandLineArgumentProvider {
    /** The directory of class-path files, one per application; each file lists jars that are read. */
    @Input
    abstract Property<String> getCorpus()

    @Override
    Iterable<String> asArguments() {
        ["-Drunner.transformCorpus=${corpus.get()}".toString()]
    }
}

tasks.register('transformCorpusTest', Test) {
    group = 'verification'
    description = 'Runs the class transform pipeline over the class paths named by -Prunner.transformCorpus=<dir>'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'transform-corpus' }
    def arguments = objects.newInstance(TransformCorpusArguments)
    arguments.corpus.set(providers.gradleProperty('runner.transformCorpus').orElse(''))
    jvmArgumentProviders.add(arguments)
    // The jars the class paths name are not inputs Gradle can see, so the result is never reused.
    outputs.upToDateWhen { false }
    testLogging.showStandardStreams = true
}

tasks.named('compileStaticServicesJava', JavaCompile) {
    options.release = 25
    // These classes run while the application starts: no invokedynamic string concatenation in them.
    options.compilerArgs.addAll(['-XDstringConcat=inline'])
    // Line numbers for stack traces, no local variable tables: every application carries these classes.
    options.debugOptions.debugLevel = 'source,lines'
}

def staticServicesJar = tasks.register('staticServicesJar', Jar) {
    description = 'Packages the static service table classes that runner-build carries as a resource'
    archiveFileName = 'static-services.jar'
    destinationDirectory = layout.buildDirectory.dir('static-services')
    from sourceSets.staticServices.output
    // Only the shape the other classes compile against: the generator writes the real table per application.
    exclude '**/RunnerServiceTable.class'
}

tasks.named('processResources', ProcessResources) {
    from(configurations.launcherJar) {
        into 'META-INF/micronaut-runner'
        rename { 'launcher.jar' }
    }
    from(logbackFrontendJar) {
        into 'META-INF/micronaut-runner'
    }
    from(staticServicesJar) {
        into 'META-INF/micronaut-runner'
    }
}
