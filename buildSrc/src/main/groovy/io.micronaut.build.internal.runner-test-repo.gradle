/*
 * Publishes every Maven publication of this project a second time, with version "<v>-DUMMY" instead of
 * "-SNAPSHOT", into <project>/build/test-repo, and exposes that directory through the consumable
 * configuration "repository". test-suite, benchmarks and the plugin functional tests aggregate those
 * directories into a single local Maven repository, so they consume exactly what users would consume
 * (real POMs, plugin markers, plugin.xml) instead of a composite-build substitution.
 *
 * -DUMMY (rather than -SNAPSHOT) keeps Gradle's and Maven's changing-module caching out of the picture.
 *
 * Adapted from micronaut-gradle-plugin's io.micronaut.internal.build.gradle-plugin convention plugin.
 */
plugins {
    id 'maven-publish'
}

def testRepoPath = layout.buildDirectory.dir('test-repo')

configurations {
    repository {
        canBeConsumed = true
        canBeResolved = false
    }
}

publishing {
    repositories {
        maven {
            // Not "Build": MicronautPublishingPlugin already registers a repository with that name.
            name = 'testRepo'
            url = testRepoPath.get().asFile.toURI()
        }
    }
    publications.all { pub ->
        if (!pub.name.startsWith('local')) {
            String pubName = "local${pub.name.capitalize()}"
            publications.register(pubName, MavenPublication) {
                project.afterEvaluate {
                    // Gradle 8.3+ exposes the component as a Provider
                    def component = pub.component
                    if (component != null && component.respondsTo('isPresent')) {
                        component = component.isPresent() ? component.get() : null
                    }
                    alias = true
                    groupId = pub.groupId
                    artifactId = pub.artifactId
                    version = project.version.toString().replace('-SNAPSHOT', '-DUMMY')
                    if (component == null) {
                        // A java-gradle-plugin marker publication: a POM whose only dependency is the plugin jar
                        String pName = project.name
                        String pGroup = project.group.toString()
                        String pVersion = project.version.toString().replace('-SNAPSHOT', '-DUMMY')
                        pom.withXml {
                            def dep = asNode().appendNode('dependencies').appendNode('dependency')
                            dep.appendNode('groupId', pGroup)
                            dep.appendNode('artifactId', pName)
                            dep.appendNode('version', pVersion)
                        }
                    } else {
                        from(component)
                        String pGroup = project.group.toString()
                        pom.withXml {
                            // project(...) dependencies are rendered with -SNAPSHOT; point them at the DUMMY twins
                            asNode().dependencies.dependency.each { n ->
                                if (n.groupId[0].text() == pGroup && n.version[0].text().endsWith('-SNAPSHOT')) {
                                    n.version[0].value = n.version[0].text().replace('-SNAPSHOT', '-DUMMY')
                                }
                            }
                        }
                    }
                }
            }
        }
    }
}

// Gradle Module Metadata for the alias publications would reference the -SNAPSHOT variants
tasks.withType(GenerateModuleMetadata).configureEach {
    if (name.contains('ForLocal')) {
        enabled = false
    }
}

def cleanTestRepo = tasks.register('cleanTestRepo', Delete) {
    delete testRepoPath
}

// A live collection, deliberately, rather than the list of names collected while the publications were
// being registered. java-gradle-plugin contributes its publications from afterEvaluate, so that list is
// still growing after this task is configured: whether the plugin's own artifacts were published at all
// then depended on when the task happened to be realised, which differs with the set of tasks requested.
// It cost a CI run on which the Gradle plugin was silently absent from the repository the samples resolve.
def publishTwinsToTestRepo = tasks.withType(PublishToMavenRepository).matching { task ->
    task.name.startsWith('publishLocal') && task.name.endsWith('PublicationToTestRepoRepository')
}

publishTwinsToTestRepo.configureEach {
    mustRunAfter cleanTestRepo
}

def publishToTestRepo = tasks.register('publishToTestRepo') {
    description = 'Publishes the -DUMMY twin publications into build/test-repo'
    dependsOn cleanTestRepo
    dependsOn publishTwinsToTestRepo
}

/**
 * The point at which the test repository is complete. A project that has to post-process what it
 * published - the Maven plugin rewrites the version inside its own descriptor - makes its task a
 * dependency of this one. finalizedBy would not do: a finalizer is ordered against the task it finalises,
 * not against the tasks that consume that task's output, so a consumer can read the repository first.
 */
def finalizeTestRepo = tasks.register('finalizeTestRepo') {
    description = 'Marks the -DUMMY test repository as complete, after any post-processing'
    dependsOn publishToTestRepo
}

configurations.repository.outgoing {
    artifact(testRepoPath) {
        builtBy(finalizeTestRepo)
    }
}

// The DUMMY twins must never reach the real 'Build' repo (bundled for Maven Central), Sonatype or mavenLocal
tasks.withType(PublishToMavenRepository).configureEach {
    def isLocal = provider { publication.name.startsWith('local') }
    def isTestRepo = provider { repository.name == 'testRepo' }
    onlyIf('local publications only go to testRepo, real publications never do') {
        isLocal.get() == isTestRepo.get()
    }
}
tasks.withType(PublishToMavenLocal).configureEach {
    def isLocal = provider { publication.name.startsWith('local') }
    onlyIf('local publications are never installed') { !isLocal.get() }
}
