/*
 * A published Maven plugin module, built by Gradle.
 */
plugins {
    id 'io.micronaut.build.internal.runner-module'
    // org.gradlex.maven-plugin-development generates META-INF/maven/plugin.xml from the @Mojo annotations
    // (task generateMavenPluginDescriptor, wired into the jar) and an optional HelpMojo.
    id 'org.gradlex.maven-plugin-development'
}

dependencies {
    // Provided by the Maven runtime: compileOnly keeps them out of the published POM.
    compileOnly libs.maven.plugin.api
    compileOnly libs.maven.core
    compileOnly libs.maven.plugin.annotations

    // Nothing provides them to a test, which has to build a MavenProject and call the Mojo itself.
    testImplementation libs.maven.plugin.api
    testImplementation libs.maven.core
    testImplementation libs.maven.plugin.annotations
}

mavenPlugin {
    // groupId/artifactId/version/name/description default to the project's
    goalPrefix = 'mn-runner'
    helpMojoPackage = 'io.micronaut.runner.maven.help'
}

publishing {
    publications.configureEach {
        if (it instanceof MavenPublication && !it.name.startsWith('local')) {
            it.pom.packaging = 'maven-plugin'
        }
    }
}

// The Maven plugin descriptor generator emits a HelpMojo into a generated source directory that is part
// of the main source set. It is machine-generated, so it is exempt from the code style rules.
tasks.named('checkstyleMain', Checkstyle) {
    exclude '**/maven/help/**'
}

// The same generated HelpMojo documents itself with the legacy Maven javadoc tags (@goal,
// @requiresProject), which the javadoc tool rejects outright.
tasks.named('javadoc', Javadoc) {
    exclude '**/maven/help/**'
}

// A Maven plugin jar embeds META-INF/maven/plugin.xml, which repeats the plugin's own version. Produce
// the -DUMMY jar before publishing so Gradle creates checksums from the final bytes. The source jar used by
// the real publication remains untouched.
def realVersion = providers.gradleProperty('projectVersion')
def dummyVersion = realVersion.map { it.replace('-SNAPSHOT', '-DUMMY') }
def patchedArtifactDirectory = layout.buildDirectory.dir('test-repo-artifacts/maven-plugin')
def patchedArtifact = dummyVersion.flatMap { version ->
    patchedArtifactDirectory.map { it.file("${project.name}-${version}.jar") }
}
def patchTestRepoDescriptor = tasks.register('patchTestRepoDescriptor') {
    description = 'Produces the Maven plugin jar whose embedded descriptors carry the -DUMMY version'
    def sourceJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
    inputs.file(sourceJar)
            .withPropertyName('sourcePluginJar')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.property('sourceVersion', realVersion)
    inputs.property('targetVersion', dummyVersion)
    inputs.property('descriptorGroup', provider { project.group.toString() })
    inputs.property('descriptorArtifact', provider { project.name })
    outputs.dir(patchedArtifactDirectory).withPropertyName('patchedPluginDirectory')
    outputs.cacheIf('descriptor patch has complete declared inputs and outputs') { true }
    doLast {
        def from = realVersion.get()
        def to = dummyVersion.get()
        def descriptors = ['META-INF/maven/plugin.xml',
                           "META-INF/maven/${project.group}/${project.name}/plugin-help.xml".toString()] as Set
        def outputFile = patchedArtifact.get().asFile
        def temporary = new File(outputFile.parentFile, outputFile.name + '.tmp')
        delete patchedArtifactDirectory
        outputFile.parentFile.mkdirs()
        def rewritten = [] as Set
        new java.util.zip.ZipInputStream(sourceJar.get().asFile.newInputStream()).withCloseable { input ->
            new java.util.zip.ZipOutputStream(temporary.newOutputStream()).withCloseable { output ->
                def entry
                while ((entry = input.nextEntry) != null) {
                    byte[] bytes = input.readAllBytes()
                    if (descriptors.contains(entry.name)) {
                        def text = new String(bytes, 'UTF-8')
                        if (text.contains("<version>${from}</version>")) {
                            bytes = text.replace("<version>${from}</version>", "<version>${to}</version>")
                                    .getBytes('UTF-8')
                            rewritten << entry.name
                        }
                    }
                    // Always STORED-or-DEFLATED as a fresh entry: sizes change when the version does.
                    def copy = new java.util.zip.ZipEntry(entry.name)
                    copy.time = entry.time
                    output.putNextEntry(copy)
                    output.write(bytes)
                    output.closeEntry()
                }
            }
        }
        if (rewritten != descriptors) {
            temporary.delete()
            throw new GradleException("Expected to rewrite ${descriptors}, rewrote ${rewritten}")
        }
        java.nio.file.Files.move(temporary.toPath(), outputFile.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        logger.info("Rewrote ${rewritten} to version ${to} in ${outputFile.name}")
    }
}

publishing.publications.withType(MavenPublication).configureEach { publication ->
    if (publication.name == 'localMaven') {
        project.afterEvaluate {
            def sourceArtifact = publication.artifacts.find {
                it.extension == 'jar' && !it.classifier
            }
            if (sourceArtifact != null) {
                publication.artifacts.remove(sourceArtifact)
            }
            publication.artifact(patchedArtifact) {
                builtBy patchTestRepoDescriptor
            }
        }
    }
}
