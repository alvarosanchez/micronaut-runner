plugins {
    id 'io.micronaut.build.internal.runner-gradle-plugin'
}

description = 'Gradle plugin that packages Micronaut applications as fast-starting single executable jars'

gradlePlugin {
    plugins {
        // The declaration keeps its name, runner, so its publish tasks keep theirs. The id leaves
        // io.micronaut.runner to micronaut-gradle-plugin, whose plugin of that id replaces this one.
        runner {
            id = 'io.micronaut.runner.standalone'
            implementationClass = 'io.micronaut.runner.gradle.MicronautRunnerPlugin'
            displayName = 'Micronaut Runner Plugin (interim)'
            description = 'Packages Micronaut applications as fast-starting single executable jars. Interim:' +
                    ' micronaut-gradle-plugin\'s io.micronaut.runner replaces it, with the same tasks and' +
                    ' micronaut { runner { } } block.'
            tags.set(['micronaut', 'packaging', 'executable-jar'])
        }
    }
}

dependencies {
    implementation projects.micronautRunnerBuild

    // Everything the plugin's POM transitively needs must be in the aggregated test repository
    pluginsUnderTest project(path: ':micronaut-runner-launcher', configuration: 'repository')
    pluginsUnderTest project(path: ':micronaut-runner-build', configuration: 'repository')
    pluginsUnderTest project(path: path, configuration: 'repository')
}

// The fixtures of the functional tests resolve the plugin from the aggregated test repository alone, so the modules
// from outside this build that it needs, micronaut-aot-bytecode, micronaut-aot-logback and micronaut-aot-service-index,
// are laid out there too, as a Maven repository holds them.
configurations {
    externalModulesUnderTest {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}

def externalModules = [libs.micronaut.aot.bytecode, libs.micronaut.aot.logback, libs.micronaut.aot.service.index]
        .collect { it.get() }

dependencies {
    externalModules.each { module ->
        def coordinates = "${module.group}:${module.name}:${module.version}"
        externalModulesUnderTest coordinates
        externalModulesUnderTest "${coordinates}@pom"
    }
}

tasks.named('prepareRepository', Sync) {
    externalModules.each { module ->
        from(configurations.externalModulesUnderTest) {
            include "${module.name}-*"
            into "${module.group.replace('.', '/')}/${module.name}/${module.version}"
            rename { String file -> "${module.name}-${module.version}${file.substring(file.lastIndexOf('.'))}" }
        }
    }
}
