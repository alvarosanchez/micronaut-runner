plugins {
    id 'io.micronaut.build.internal.runner-maven-plugin'
}

description = 'Maven plugin that packages Micronaut applications as fast-starting single executable jars'

dependencies {
    implementation projects.micronautRunnerBuild

    // Reads project.build.outputTimestamp exactly as maven-jar-plugin does in the same build. It needs
    // plexus-archiver and plexus-interpolation at runtime, which it brings along.
    implementation libs.maven.archiver
}
