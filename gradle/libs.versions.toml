#
# Only aliases prefixed "managed-"/"boms-" end up in micronaut-runner-bom. Nothing here is managed on
# purpose: the BOM should contain only our own modules.
#

[versions]
micronaut = "5.2.2"                 # core; read by micronaut-build for the mn catalog
micronaut-docs = "3.0.0"
micronaut-test = "5.1.1"
micronaut-logging = "2.1.0"
micronaut-platform = "5.1.5"        # sample applications only
micronaut-gradle-plugin = "5.0.2"   # io.micronaut.application, used by the sample applications
micronaut-flyway = "8.1.1"
micronaut-sql = "7.1.3"

junit = "6.1.3"
jmh = "1.37"
maven = "3.9.16"                    # maven-plugin-api / maven-core
maven-plugin-tools = "3.16.0"       # maven-plugin-annotations
maven-invoker = "3.3.0"
maven-archiver = "3.6.6"            # MavenArchiver.parseBuildOutputTimestamp, as maven-jar-plugin applies it
bouncycastle = "1.84"
h2 = "2.4.240"

# Gradle plugins placed on the buildSrc classpath and applied by id from convention plugins
gradle-plugin-publish = "2.2.1"
maven-plugin-development = "1.0.3"  # org.gradlex
jmh-plugin = "0.7.3"                # me.champeau.jmh
shadow = "9.6.1"                    # com.gradleup.shadow (benchmark comparison packaging only)

[libraries]
# Core
micronaut-core = { module = 'io.micronaut:micronaut-core-bom', version.ref = 'micronaut' }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-generator-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
maven-plugin-api = { module = "org.apache.maven:maven-plugin-api", version.ref = "maven" }
maven-core = { module = "org.apache.maven:maven-core", version.ref = "maven" }
maven-plugin-annotations = { module = "org.apache.maven.plugin-tools:maven-plugin-annotations", version.ref = "maven-plugin-tools" }
maven-invoker = { module = "org.apache.maven.shared:maven-invoker", version.ref = "maven-invoker" }
maven-archiver = { module = "org.apache.maven:maven-archiver", version.ref = "maven-archiver" }
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }

# Plugin marker coordinates for the buildSrc classpath
plugin-gradle-publish = { module = "com.gradle.publish:plugin-publish-plugin", version.ref = "gradle-plugin-publish" }
plugin-maven-plugin-development = { module = "org.gradlex.maven-plugin-development:org.gradlex.maven-plugin-development.gradle.plugin", version.ref = "maven-plugin-development" }
plugin-jmh = { module = "me.champeau.jmh:me.champeau.jmh.gradle.plugin", version.ref = "jmh-plugin" }

[bundles]

[plugins]
# Used by the standalone sample builds under test-suite/samples (they import this catalog by path)
micronaut-application = { id = "io.micronaut.application", version.ref = "micronaut-gradle-plugin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
