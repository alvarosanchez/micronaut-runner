projectVersion=1.0.0-SNAPSHOT
projectGroup=io.micronaut.runner

title=Micronaut Runner
projectDesc=Fast-starting single-jar packaging for Micronaut applications (launcher, Gradle and Maven plugins)
projectUrl=https://micronaut.io
githubSlug=micronaut-projects/micronaut-runner
developers=Alvaro Sanchez-Mariscal

# TestKit matrix for :micronaut-runner-gradle-plugin:functionalTest and :test-suite:test.
# 9.1.0 is the first Gradle able to run on JDK 25; it cannot run on JDK 26 (needs 9.4).
runner.testkit.gradleVersions=9.1.0,9.7.1
# Iterations for the startup benchmark harness (CI overrides with -Pbenchmarks.iterations)
benchmarks.iterations=10

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=false
org.gradle.configuration-cache.parallel=false
org.gradle.caching=true
org.gradle.parallel=true
