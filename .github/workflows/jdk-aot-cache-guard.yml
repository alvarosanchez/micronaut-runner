# JDK AOT cache guard. Not synced from micronaut-project-template.
#
# Trains and verifies the JDK AOT cache of benchmark-large with the interim Gradle plugin's
# micronautRunnerJdkAotCache task, once per target, on the LTS, the newest GA and the early-access JDK, on Linux
# and macOS, and runs the forked AotCacheBuilderTest on the same JDK. It times nothing: it catches a JDK build that
# stops caching Runner's classes, which would empty the single-JAR cache without a failure anywhere else. The
# single JAR is recorded with RunnerClassLoader's training-only file: code source (#158), which JDK-8380291 (JDK 27
# and later) requires; a JDK that re-reads those sources when it creates the cache, or checks the code source at
# run time, fails the singleJar step on every leg.
#
# It runs weekly, one hour after the benchmarks job, on demand, and on pull requests that change the guard or the
# cache engine. If the interim plugins go away, the change that removes them moves this guard to a benchmarks task
# that calls AotCacheOutput on the same sample, so the check outlives them.
name: JDK AOT cache guard
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'
  pull_request:
    branches:
      - master
      - '[0-9]+.[0-9]+.x'
    paths:
      - '.github/workflows/jdk-aot-cache-guard.yml'
      - '.github/jdk-aot-cache-guard/**'
      # The cache engine, which shares runner-build's package with the Runner JAR code (#233).
      - 'runner-build/src/main/java/io/micronaut/runner/build/AotCacheBuilder.java'
      - 'runner-build/src/main/java/io/micronaut/runner/build/AotCacheGate.java'
      - 'runner-build/src/main/java/io/micronaut/runner/build/AotCacheReport.java'
      - 'runner-build/src/main/java/io/micronaut/runner/build/AotCacheSettings.java'
      - 'runner-build/src/main/java/io/micronaut/runner/build/AotLaunchOptions.java'
      - 'runner-build/src/main/java/io/micronaut/runner/build/Forks.java'
      - 'runner-build/src/main/java/io/micronaut/runner/build/JdkProbe.java'
      - 'runner-build/src/main/java/io/micronaut/runner/build/TrainingDriver.java'
      - 'runner-build/src/main/java/io/micronaut/runner/build/AotCacheOutput.java'
      - 'runner-build/src/main/java/io/micronaut/runner/build/AotLayout.java'
      - 'runner-build/src/main/java/io/micronaut/runner/build/AotTarget.java'
      - 'runner-build/src/main/java/io/micronaut/runner/build/training/**'
      - 'runner-launcher/src/main/java/io/micronaut/runner/RunnerClassLoader.java'
      - 'runner-launcher/src/main/java/io/micronaut/runner/Handlers.java'
      # The forked test this guard runs on the matrix JDK, and the convention that hands it that JDK.
      - 'runner-build/src/test/java/io/micronaut/runner/build/AotCacheBuilderTest.java'
      - 'runner-build/src/test/java/io/micronaut/runner/build/AotCacheFixture.java'
      - 'runner-build/src/test/java/io/micronaut/runner/build/AotCacheFixtureLibrary.java'
      - 'buildSrc/src/main/groovy/io.micronaut.build.internal.runner-base.gradle'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guard:
    name: "${{ matrix.os }} JDK ${{ matrix.java }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The LTS, the newest GA and the early access. Bump the last two at each GA; 27 GA superseded 26.
        java: ['25', '27', '28-ea']
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: "🔧 Setup JDK ${{ matrix.java }} for the cache"
        id: jdk
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      # Installed last, so JAVA_HOME and Gradle stay on 25 whatever the matrix JDK is.
      - name: "🔧 Setup JDK 25 for Gradle"
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: "🔧 Setup Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: "📦 Publish the -DUMMY plugins"
        run: ./gradlew :benchmarks:prepareRepository --no-daemon

      - name: "🧭 Resolve the build arguments"
        run: |
          version=$(sed -n 's/^projectVersion=//p' gradle.properties)
          java='${{ matrix.java }}'
          {
            echo "GUARD_RUNNER_VERSION=${version/-SNAPSHOT/-DUMMY}"
            echo "GUARD_RUNNER_REPO=file://$PWD/benchmarks/build/aggregated-repo/"
            echo "GUARD_JAVA=${java%%-*}"
          } >> "$GITHUB_ENV"
          mkdir -p guard-reports

      # Both targets write the same directory, so each report is copied right after its build.
      - name: "🧊 Train and verify the layout cache"
        run: |
          status=0
          ./gradlew -p test-suite/samples/benchmark-large --no-daemon \
            -Prunner.repo="$GUARD_RUNNER_REPO" -Prunner.version="$GUARD_RUNNER_VERSION" \
            micronautRunnerJdkAotCache \
            --init-script "$PWD/.github/jdk-aot-cache-guard/layout.gradle" \
            -Pguard.javaVersion="$GUARD_JAVA" \
            -Porg.gradle.java.installations.paths='${{ steps.jdk.outputs.path }}' \
            -Porg.gradle.java.installations.auto-download=false || status=$?
          report=test-suite/samples/benchmark-large/build/micronaut-runner/jdk-aot-cache/aot-report.json
          if [ -f "$report" ]; then cp "$report" guard-reports/layout.json; fi
          exit "$status"

      # Enforced on every leg: the recording reports file: code sources (#158), so JDK 27 and later cache
      # RunnerClassLoader's classes too (JDK-8380291). It fails when the build warns that they were not cached.
      - name: "🧊 Train and verify the single-JAR cache"
        run: |
          status=0
          ./gradlew -p test-suite/samples/benchmark-large --no-daemon \
            -Prunner.repo="$GUARD_RUNNER_REPO" -Prunner.version="$GUARD_RUNNER_VERSION" \
            micronautRunnerJdkAotCache \
            --init-script "$PWD/.github/jdk-aot-cache-guard/singleJar.gradle" \
            -Pguard.javaVersion="$GUARD_JAVA" \
            -Porg.gradle.java.installations.paths='${{ steps.jdk.outputs.path }}' \
            -Porg.gradle.java.installations.auto-download=false || status=$?
          report=test-suite/samples/benchmark-large/build/micronaut-runner/jdk-aot-cache/aot-report.json
          if [ -f "$report" ]; then cp "$report" guard-reports/singleJar.json; fi
          if [ "$status" -ne 0 ]; then
            echo "::error::The singleJar cache build failed on JDK ${{ matrix.java }}"
            exit "$status"
          fi
          # Half of the io.micronaut classes from the cache, and no warning that they were not: a JDK that stops
          # caching RunnerClassLoader's classes fails this on every leg.
          if ! jq -e '.micronautFromCache * 2 >= .micronautLoaded' guard-reports/singleJar.json > /dev/null; then
            echo "::error::On JDK ${{ matrix.java }} the single-JAR cache served $(jq -r '"\(.micronautFromCache) of \(.micronautLoaded)"' guard-reports/singleJar.json) io.micronaut classes"
            exit 1
          fi
          if jq -e '[.warnings[] | select(startswith("Fewer than half of the io.micronaut classes"))] | length > 0' guard-reports/singleJar.json > /dev/null; then
            echo "::error::On JDK ${{ matrix.java }} the single-JAR build warned that RunnerClassLoader's classes were not cached"
            exit 1
          fi

      # Runs even when the step above fails: the warning is what a plugin user sees, so it has to appear exactly
      # when fewer than half of the io.micronaut classes were cached.
      - name: "🔎 Check the single-JAR warning"
        if: ${{ !cancelled() }}
        run: |
          report=guard-reports/singleJar.json
          if [ ! -f "$report" ] || ! jq -e '.verdict == "passed"' "$report" > /dev/null; then
            echo "No passed single-JAR report on JDK ${{ matrix.java }}, so no warning to check"
            exit 0
          fi
          cached=$(jq '.micronautFromCache * 2 >= .micronautLoaded' "$report")
          warned=$(jq '[.warnings[] | select(startswith("Fewer than half of the io.micronaut classes"))] | length > 0' "$report")
          if [ "$cached" = "$warned" ]; then
            echo "::error::On JDK ${{ matrix.java }} the single-JAR warning disagrees with the counts: half of the io.micronaut classes cached: $cached, warned: $warned"
            exit 1
          fi
          echo "Half of the io.micronaut classes cached: $cached, warned: $warned"

      # The forked cache test, on the matrix JDK. On a JDK with the file: rule its negative control runs rather than
      # skips, which proves that its single-JAR case would see the rule.
      - name: "🧪 Run AotCacheBuilderTest on JDK ${{ matrix.java }}"
        if: ${{ !cancelled() }}
        run: |
          ./gradlew :micronaut-runner-build:test --tests "*AotCacheBuilderTest" --no-daemon \
            -Prunner.test.javaHome='${{ steps.jdk.outputs.path }}'

      - name: "📝 Summarize the reports"
        if: always()
        run: |
          {
            echo "### JDK AOT cache guard: ${{ matrix.os }}, JDK ${{ matrix.java }}"
            echo
            echo "| Target | JDK | Coverage | io.micronaut from the cache | Lambdas spun at run time | Record stop | Strict probes failed | Verdict | Warnings |"
            echo "|---|---|---|---|---|---|---|---|---|"
            for target in layout singleJar; do
              file="guard-reports/$target.json"
              if [ -f "$file" ]; then
                jq -r --arg t "$target" '"| \($t) | \(.jdk) | \((.coverage * 1000 | round) / 10)% | \(.micronautFromCache) of \(.micronautLoaded) | \(.runtimeLambdas) | \(.recordStop) | \(.probeFailures) of \(.probes) | \(.verdict) | \(.warnings | length) |"' "$file"
              else
                echo "| $target | | | | | | | no report | |"
              fi
            done
            echo
            xml=runner-build/build/test-results/test/TEST-io.micronaut.runner.build.AotCacheBuilderTest.xml
            if [ -f "$xml" ]; then
              suite=$(grep -o '<testsuite [^>]*>' "$xml" | head -1)
              attribute() { echo "$suite" | sed -n "s/.* $1=\"\([^\"]*\)\".*/\1/p"; }
              control=ran
              if grep -A1 'name="withoutTheTrainingModeAJdkWithTheFileRuleLeavesTheDependencyOut()"' "$xml" | grep -q '<skipped'; then
                control=skipped
              fi
              echo "AotCacheBuilderTest: $(attribute tests) tests, $(attribute failures) failures, $(attribute errors) errors, $(attribute skipped) skipped; the file: rule's negative control $control."
            else
              echo "AotCacheBuilderTest: no result"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "📤 Upload the reports"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jdk-aot-cache-guard-${{ matrix.os }}-${{ matrix.java }}
          path: |
            guard-reports/
            runner-build/build/test-results/test/TEST-io.micronaut.runner.build.AotCacheBuilderTest.xml
            test-suite/samples/benchmark-large/build/micronaut-runner/jdk-aot-cache/*.log
            test-suite/samples/benchmark-large/build/micronaut-runner/jdk-aot-cache/app.aot.properties
          if-no-files-found: warn
