# This workflow is specific to micronaut-runner and is NOT synced from micronaut-project-template.
# The synced "Java CI" workflow builds on a single JDK; this one covers the JDK and OS matrix that a
# packaging format and a class loader need, and reports the results per JDK.
name: Runner CI
on:
  push:
    branches:
      - master
      - '[0-9]+.[0-9]+.x'
  pull_request:
    branches:
      - master
      - '[0-9]+.[0-9]+.x'
permissions:
  contents: read
  checks: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  jdk-matrix:
    name: "Linux JDK ${{ matrix.java }}"
    runs-on: ubuntu-latest
    # JDK 26 is early access: it must inform us without failing the build.
    continue-on-error: ${{ matrix.java == '26-ea' }}
    strategy:
      fail-fast: false
      matrix:
        java: ['25', '26-ea']
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: "🔧 Setup JDK ${{ matrix.java }}"
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: "🔧 Setup Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      # A workflow file that does not parse is not reported as a failure of anything: GitHub records a
      # run with no jobs and no name, which reads like a passing build. Parsing them here, from a
      # workflow that does parse, turns that into an ordinary test failure.
      - name: "🔎 Validate the workflow files"
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = []
          for path in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  document = yaml.safe_load(open(path))
                  if not document.get('name'):
                      bad.append(f'{path}: no name')
              except Exception as error:
                  bad.append(f'{path}: {error}')
          for line in bad:
              print(line)
          sys.exit(1 if bad else 0)
          PY

      # The user guide states rounded, relative performance claims only (CONTRIBUTING.md, "Benchmarks").
      # Measured values, harness row names and CI run links belong in pull requests and benchmarks/README.md.
      # Whole-number MB stays allowed, for the JVM's own ergonomics threshold; percentages appear on the
      # Performance page only.
      - name: "📏 Check that the guide carries no measurements"
        if: matrix.java == '25'
        run: |
          if grep -rnE 'actions/runs/|95% CI|[0-9]+\.[0-9]+ ?(ms|s|MiB|MB|KiB|µs)\b|[0-9]+ ?(ms|MiB|KiB|µs)\b|[0-9]{1,3}(,[0-9]{3})+ ?(B|bytes)\b|\b(runner|shadow)-(stored|preserve|extracted|maot|aot)\b|vCPU|benchmark-large|RssAnon|phys_footprint' src/main/docs/guide; then
            echo "::error::The user guide contains measured values or benchmark details; see CONTRIBUTING.md"
            exit 1
          fi
          if grep -rnE '[0-9]+(\.[0-9]+)? ?%' src/main/docs/guide --exclude=performance.adoc; then
            echo "::error::Percentages belong on the guide's Performance page only; see CONTRIBUTING.md"
            exit 1
          fi

      # Each guide page is rendered on its own, so a cross-reference without link text (<<id>>) is
      # published as the literal text "[id]" (CONTRIBUTING.md, "Building Documentation").
      - name: "🔗 Check that every guide cross-reference has link text"
        if: matrix.java == '25'
        run: |
          ./gradlew publishGuide --no-daemon
          guide=build/working/02-docs-raw/all/guide/index.html
          test -s "$guide" || { echo "::error::publishGuide did not write $guide"; exit 1; }
          if grep -noE '>\[[A-Za-z]+\]</a>' "$guide"; then
            echo "::error::A guide cross-reference has no link text; write <<id,Text>>"
            exit 1
          fi

      # Building buildSrc does not run its tests, and check does not either: the build-logic tests run
      # here only, in the same Gradle invocation, on one JDK.
      - name: "🛠 Build and test"
        run: ./gradlew check ${{ matrix.java == '25' && ':buildSrc:test' || '' }} --continue --no-daemon -Prunner.integration=required

      - name: "📦 Publication smoke test"
        if: matrix.java == '25'
        run: ./gradlew :test-suite:publicationSmokeTest --no-daemon -Prunner.integration=required -PprojectVersion=1.0.0-PUBLICATION-SMOKE

      - name: "📊 Publish Test Report"
        if: always()
        uses: mikepenz/action-junit-report@bccf2e31636835cf0874589931c4116687171386 # v6
        with:
          check_name: Runner CI / Test Report (${{ matrix.java }})
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_retries: 'true'

  windows:
    name: "Windows JDK 25"
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: "🔧 Setup JDK 25"
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: "🔧 Setup Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      # Path separators, drive letters, UNC paths and file locking on memory-mapped archives all behave
      # differently here, which is exactly what the launcher and the packager touch.
      - name: "🛠 Test the launcher, the packager and the end-to-end suite"
        run: ./gradlew :micronaut-runner-launcher:test :micronaut-runner-build:test :test-suite:test --no-daemon -Prunner.integration=required

      - name: "📊 Publish Test Report"
        if: always()
        uses: mikepenz/action-junit-report@bccf2e31636835cf0874589931c4116687171386 # v6
        with:
          check_name: Runner CI / Test Report (Windows)
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_retries: 'true'
