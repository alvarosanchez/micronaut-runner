# This workflow is specific to micronaut-runner and is NOT synced from micronaut-project-template.
# The synced "Java CI" workflow builds on a single JDK; this one covers the JDK and OS matrix that a
# packaging format and a class loader need, and reports the results per JDK.
name: Runner CI
on:
  push:
    branches:
      - master
      - '[0-9]+.[0-9]+.x'
  pull_request:
    branches:
      - master
      - '[0-9]+.[0-9]+.x'
permissions:
  contents: read
  checks: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  jdk-matrix:
    name: "Linux JDK ${{ matrix.java }}"
    runs-on: ubuntu-latest
    # JDK 26 is early access: it must inform us without failing the build.
    continue-on-error: ${{ matrix.java == '26-ea' }}
    strategy:
      fail-fast: false
      matrix:
        java: ['25', '26-ea']
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: "🔧 Setup JDK ${{ matrix.java }}"
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: "🔧 Setup Gradle"
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6

      # A workflow file that does not parse is not reported as a failure of anything: GitHub records a
      # run with no jobs and no name, which reads like a passing build. Parsing them here, from a
      # workflow that does parse, turns that into an ordinary test failure.
      - name: "🔎 Validate the workflow files"
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = []
          for path in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  document = yaml.safe_load(open(path))
                  if not document.get('name'):
                      bad.append(f'{path}: no name')
              except Exception as error:
                  bad.append(f'{path}: {error}')
          for line in bad:
              print(line)
          sys.exit(1 if bad else 0)
          PY

      - name: "🛠 Build and test"
        run: ./gradlew check --continue --no-daemon -Prunner.integration=required

      - name: "📊 Publish Test Report"
        if: always()
        uses: mikepenz/action-junit-report@bccf2e31636835cf0874589931c4116687171386 # v6
        with:
          check_name: Runner CI / Test Report (${{ matrix.java }})
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_retries: 'true'

      - name: "📜 Retain integration scenario evidence"
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: integration-scenario-evidence-linux-${{ matrix.java }}
          path: |
            test-suite/build/test-results/test/TEST-*.xml
            test-suite/build/reports/integration-scenarios.txt
          if-no-files-found: error

  windows:
    name: "Windows JDK 25"
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: "🔧 Setup JDK 25"
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: "🔧 Setup Gradle"
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6

      # Path separators, drive letters, UNC paths and file locking on memory-mapped archives all behave
      # differently here, which is exactly what the launcher and the packager touch.
      - name: "🛠 Test the launcher, the packager and the end-to-end suite"
        run: ./gradlew :micronaut-runner-launcher:test :micronaut-runner-build:test :test-suite:verifyIntegrationScenarios --no-daemon -Prunner.integration=required

      - name: "📊 Publish Test Report"
        if: always()
        uses: mikepenz/action-junit-report@bccf2e31636835cf0874589931c4116687171386 # v6
        with:
          check_name: Runner CI / Test Report (Windows)
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_retries: 'true'

      - name: "📜 Retain integration scenario evidence"
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: integration-scenario-evidence-windows-25
          path: |
            test-suite/build/test-results/test/TEST-*.xml
            test-suite/build/reports/integration-scenarios.txt
          if-no-files-found: error
