# Startup and class-loading benchmarks. Not synced from micronaut-project-template.
#
# Benchmarks are deliberately NOT part of the pull request gate: the numbers are too noisy on shared
# runners to fail a build on, and a full run is expensive. They run on demand, weekly, and on pull
# requests that opt in with the "relates-to: benchmarks" label.
name: Benchmarks
on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Measured iterations per packaging variant'
        required: false
        default: '20'
      cpus:
        description: 'Child JVM CPU limit for the benchmark job (taskset affinity); empty for none'
        required: false
        default: ''
      pageCache:
        description: 'OS page cache before each launch in the benchmark job: uncontrolled, evict-artifacts or drop-all'
        required: false
        default: 'uncontrolled'
  schedule:
    - cron: '0 4 * * 1'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - master
      - '[0-9]+.[0-9]+.x'
permissions:
  contents: read
concurrency:
  # Prefix unrelated labels into a disjoint group so their skipped run cannot cancel a benchmark.
  # All events that can run the job retain one shared group per ref.
  group: >-
    ${{ format('{0}-{1}-{2}', github.workflow, github.ref,
        github.event.action == 'labeled' &&
        github.event.label.name != 'relates-to: benchmarks' &&
        format('ignored-label:{0}', github.event.label.name) || 'benchmark') }}
  cancel-in-progress: true
jobs:
  benchmark:
    name: Run benchmarks
    # Only the benchmark label itself may start a labeled-event run. The membership check also
    # keeps opened, synchronized and reopened pull requests explicitly opted in.
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'relates-to: benchmarks') &&
       (github.event.action != 'labeled' ||
        github.event.label.name == 'relates-to: benchmarks'))
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: "🔧 Setup JDK 25"
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: "🔧 Setup Gradle"
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6

      # The benchmark-tool tests run first, in the same invocation and without --continue, so a broken
      # tool fails the job before any measurement starts.
      - name: "📈 Run benchmarks"
        env:
          BENCHMARK_ITERATIONS: ${{ github.event.inputs.iterations || '20' }}
          BENCHMARK_CPUS: ${{ github.event.inputs.cpus || '' }}
          BENCHMARK_PAGE_CACHE: ${{ github.event.inputs.pageCache || '' }}
        # The CPU and page-cache properties are added only when set, so the default command is unchanged.
        run: |
          conditions=()
          if [ -n "$BENCHMARK_CPUS" ]; then conditions+=("-Pbenchmarks.cpus=$BENCHMARK_CPUS"); fi
          if [ -n "$BENCHMARK_PAGE_CACHE" ]; then conditions+=("-Pbenchmarks.pageCache=$BENCHMARK_PAGE_CACHE"); fi
          ./gradlew :benchmarks:benchmarkIntegrationTest :benchmarks:jmh :benchmarks:packagingProfile :benchmarks:startupBenchmark "-Pbenchmarks.iterations=$BENCHMARK_ITERATIONS" "${conditions[@]}" --no-daemon

      - name: "📝 Summarise"
        if: always()
        run: |
          if [ -f benchmarks/build/reports/startup/summary.md ]; then
            cat benchmarks/build/reports/startup/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No startup benchmark summary was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f benchmarks/build/reports/packaging/packaging-summary.md ]; then
            cat benchmarks/build/reports/packaging/packaging-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No packaging profile summary was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "📜 Upload results"
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: benchmark-results
          path: |
            benchmarks/build/reports/startup/results.json
            benchmarks/build/reports/startup/summary.md
            benchmarks/build/reports/startup/diagnostics/**
            benchmarks/build/reports/packaging/packaging-results.json
            benchmarks/build/reports/packaging/packaging-summary.md
            benchmarks/build/reports/jmh/results.json
          if-no-files-found: warn
          retention-days: 30

  # The Runner and Shadow comparison rows at one and two CPUs (taskset affinity) and with a cold page cache, on
  # dispatch and schedule only. Each leg runs on its own machine, so compare the legs' paired Runner - Shadow
  # differences, never their absolute times.
  startup-cpu-matrix:
    name: "Startup: cpus=${{ matrix.cpus || 'unlimited' }}, ${{ matrix.pageCache }}"
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpus: '1'
            pageCache: uncontrolled
          - cpus: '2'
            pageCache: uncontrolled
          - cpus: ''
            pageCache: uncontrolled
          - cpus: ''
            pageCache: evict-artifacts
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: "🔧 Setup JDK 25"
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: "🔧 Setup Gradle"
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6

      - name: "📈 Run the startup benchmark"
        env:
          BENCHMARK_CPUS: ${{ matrix.cpus }}
          BENCHMARK_PAGE_CACHE: ${{ matrix.pageCache }}
        run: |
          conditions=()
          if [ -n "$BENCHMARK_CPUS" ]; then conditions+=("-Pbenchmarks.cpus=$BENCHMARK_CPUS"); fi
          ./gradlew :benchmarks:startupBenchmark -Pbenchmarks.iterations=20 \
            -Pbenchmarks.variants=shadow,shadow-stored,shadow-aot,runner-stored,runner-stored-aot,runner-preserve \
            "${conditions[@]}" "-Pbenchmarks.pageCache=$BENCHMARK_PAGE_CACHE" --no-daemon

      - name: "📝 Summarise"
        if: always()
        run: |
          if [ -f benchmarks/build/reports/startup/summary.md ]; then
            cat benchmarks/build/reports/startup/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No startup benchmark summary was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "📜 Upload results"
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: startup-cpus-${{ matrix.cpus || 'unlimited' }}-${{ matrix.pageCache }}
          path: |
            benchmarks/build/reports/startup/results.json
            benchmarks/build/reports/startup/summary.md
          if-no-files-found: warn
          retention-days: 30
