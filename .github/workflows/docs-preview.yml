# Publishes the guide to GitHub Pages while this repository lives outside micronaut-projects.
# Not synced from micronaut-project-template.
#
# The synced Java CI workflow already publishes documentation, but it needs the organisation's GH_TOKEN
# and is guarded on the owner, so under a personal fork nothing would be published and the guide could not
# be read. This workflow does the same job with the token GitHub hands every run, and is guarded the other
# way, so exactly one of the two is ever active. Delete this file on transfer.
name: Docs preview
on:
  push:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
jobs:
  publish:
    if: github.repository_owner != 'micronaut-projects'
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: "🔧 Setup JDK 25"
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: "🔧 Setup Gradle"
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6

      - name: "📖 Build the guide"
        run: ./gradlew docs --no-daemon

      # Published by hand rather than with micronaut-projects/github-pages-deploy-action: that action
      # builds its remote as https://$TOKEN@github.com/..., which git reads as a username with no
      # password. That works for a classic personal access token, which is what the organisation's
      # GH_TOKEN secret is, but not for the ephemeral token a workflow run is given, which has to be
      # presented as x-access-token:$TOKEN. The layout below is the one that action produces: the guide
      # under snapshot/, which is where the README points.
      - name: "📑 Publish to GitHub Pages"
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads "$REMOTE" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$REMOTE" "$work"
          else
            git clone --depth 1 "$REMOTE" "$work"
            git -C "$work" checkout --orphan gh-pages
            git -C "$work" rm -rf . >/dev/null 2>&1 || true
          fi
          rm -rf "$work/snapshot"
          mkdir -p "$work/snapshot"
          cp -r build/docs/. "$work/snapshot/"
          # Asciidoc output contains directories Jekyll would skip, and the repository root should not 404.
          touch "$work/.nojekyll"
          printf '<!doctype html>\n<meta http-equiv="refresh" content="0; url=snapshot/guide/">\n' > "$work/index.html"
          git -C "$work" add -A
          if git -C "$work" diff --cached --quiet; then
            echo "The published guide is already up to date."
            exit 0
          fi
          git -C "$work" commit -q -m "Publish the guide from ${{ github.sha }}"
          git -C "$work" push -q "$REMOTE" gh-pages
          echo "Published to https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/snapshot/guide/"
