# Publishes the Gradle plugin to the Gradle Plugin Portal after a successful release.
# Not synced from micronaut-project-template.
#
# The synced Release workflow already pushes the plugin and its marker to Maven Central. The Plugin
# Portal is a separate registry with its own credentials, so it needs this extra step, which runs only
# once the Release workflow has succeeded for a published release.
name: Release to Gradle Plugin Portal
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
permissions:
  contents: read
jobs:
  publish:
    # TEMPORARY (revert on transfer to micronaut-projects): nothing may be released from a
    # personal fork. Removing these lines is the deliberate act that re-enables releasing.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'release' && github.repository_owner == 'micronaut-projects'
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout the released tag"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: "🔧 Setup JDK 25"
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: "🔧 Setup Gradle"
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6

      - name: "📦 Publish plugin"
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          ./gradlew -Pgradle.publish.key="$GRADLE_PUBLISH_KEY" \
                    -Pgradle.publish.secret="$GRADLE_PUBLISH_SECRET" \
                    :micronaut-runner-gradle-plugin:publishPlugins --no-daemon
