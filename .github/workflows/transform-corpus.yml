# This workflow is specific to micronaut-runner and is NOT synced from micronaut-project-template.
# It runs the build-time class transform pipeline, with every step enabled, over the class paths of real
# Micronaut applications, and fails when a rewritten class verifies worse than the class it replaced. Resolving
# those class paths downloads a few hundred jars, so it runs weekly and on demand, never on pull requests.
name: Transform corpus
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 2'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  corpus:
    name: "Transform corpus"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: "🔧 Setup JDK 25"
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: "🔧 Setup Gradle"
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6

      # The samples apply the Runner plugin, so it is staged first, exactly as the end-to-end tests stage it.
      - name: "📦 Stage the plugins"
        run: ./gradlew :test-suite:prepareRepository --no-daemon

      - name: "🧭 Write the class paths"
        run: |
          corpus="$RUNNER_TEMP/transform-corpus"
          mkdir -p "$corpus"
          init="$GITHUB_WORKSPACE/test-suite/corpus/classpath.init.gradle"
          repo="file:$GITHUB_WORKSPACE/test-suite/build/aggregated-repo/"
          version="$(sed -n 's/^projectVersion=//p' gradle.properties | sed 's/-SNAPSHOT$/-DUMMY/')"
          for sample in benchmark-large hello-netty; do
            ./gradlew --no-daemon --no-configuration-cache --project-dir "test-suite/samples/$sample" \
              --init-script "$init" -PtransformCorpusDir="$corpus" \
              -Prunner.repo="$repo" -Prunner.version="$version" writeRuntimeClasspath
          done
          ./gradlew --no-daemon --no-configuration-cache --project-dir test-suite/corpus \
            --init-script "$init" -PtransformCorpusDir="$corpus" writeRuntimeClasspath
          ls -l "$corpus"
          echo "TRANSFORM_CORPUS=$corpus" >> "$GITHUB_ENV"

      - name: "🔬 Transform and verify"
        run: ./gradlew :micronaut-runner-build:transformCorpusTest --no-daemon -Prunner.transformCorpus="$TRANSFORM_CORPUS"

      - name: "📜 Upload the test report"
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: transform-corpus-report
          path: runner-build/build/reports/tests/transformCorpusTest/**
          if-no-files-found: warn
          retention-days: 30
