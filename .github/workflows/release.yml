# This repository intentionally carries a release-specific override of the workflow from
# micronaut-projects/micronaut-project-template. See MAINTAINING.md before syncing this file.
name: Release
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  finalize:
    # TEMPORARY (revert on transfer to micronaut-projects): nothing may be released from a
    # personal fork. Removing these lines is the deliberate act that re-enables releasing.
    if: github.repository_owner == 'micronaut-projects'
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tree: ${{ steps.source.outputs.tree }}
      version: ${{ steps.source.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GH_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Run pre-release
        uses: micronaut-projects/github-actions/pre-release@300bf6db7c062dcba77c90bb90e475df31b2acab # master
        env:
          MICRONAUT_BUILD_EMAIL: ${{ secrets.MICRONAUT_BUILD_EMAIL }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Record finalized source identity
        id: source
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          commit=$(git rev-parse HEAD)
          tree=$(git rev-parse 'HEAD^{tree}')
          target=$(jq -er '.release.target_commitish' "$GITHUB_EVENT_PATH")
          git fetch --no-tags origin "+refs/heads/${target}:refs/remotes/origin/${target}"
          git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git rev-parse "origin/${target}")" = "$commit"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$commit"
          python3 .github/scripts/release_artifacts.py record-source \
            --state build/release/source-state.json \
            --version "$version" \
            --expected-commit "$commit" \
            --expected-tree "$tree"
          {
            echo "commit=$commit"
            echo "tree=$tree"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Verify finalized source and publications
    needs: [finalize]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Remove system JDKs
        shell: bash
        run: sudo rm -rf /usr/lib/jvm/*
      - name: Checkout finalized source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.finalize.outputs.commit }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Run release artifact regression tests
        run: python .github/scripts/test_release_artifacts.py
      - uses: gradle/actions/wrapper-validation@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6
      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: 25
      - name: Record finalized source identity
        shell: bash
        run: |
          python3 .github/scripts/release_artifacts.py record-source \
            --state .release/source-state.json \
            --version "${{ needs.finalize.outputs.version }}" \
            --expected-commit "${{ needs.finalize.outputs.commit }}" \
            --expected-tree "${{ needs.finalize.outputs.tree }}"
      - name: Run finalized-tree checks
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
          DEVELOCITY_CACHE_USERNAME: ${{ secrets.GRADLE_ENTERPRISE_CACHE_USERNAME }}
          DEVELOCITY_CACHE_PASSWORD: ${{ secrets.GRADLE_ENTERPRISE_CACHE_PASSWORD }}
          GH_TOKEN_PUBLIC_REPOS_READONLY: ${{ secrets.GH_TOKEN_PUBLIC_REPOS_READONLY }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
        run: ./gradlew clean check docs --rerun-tasks --console=plain -Prunner.integration=required
      - name: Run production publication smoke test
        run: >-
          ./gradlew :test-suite:test --tests '*PublicationMetadataSmokeTest'
          --rerun-tasks --console=plain -Prunner.integration=required
      - name: Stage signed release artifacts locally
        shell: bash
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
          GPG_FILE: ${{ secrets.GPG_FILE }}
          DEVELOCITY_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
          DEVELOCITY_CACHE_USERNAME: ${{ secrets.GRADLE_ENTERPRISE_CACHE_USERNAME }}
          DEVELOCITY_CACHE_PASSWORD: ${{ secrets.GRADLE_ENTERPRISE_CACHE_PASSWORD }}
        run: |
          set -euo pipefail
          rm -rf build/repo
          umask 077
          printf '%s' "$GPG_FILE" | base64 --decode > secring.gpg
          ./gradlew \
            :micronaut-runner-bom:publishAllPublicationsToBuildRepository \
            :micronaut-runner-build:publishAllPublicationsToBuildRepository \
            :micronaut-runner-gradle-plugin:publishAllPublicationsToBuildRepository \
            :micronaut-runner-launcher:publishAllPublicationsToBuildRepository \
            :micronaut-runner-maven-plugin:publishAllPublicationsToBuildRepository \
            -DsonatypeOssUsername=local-staging \
            -DsonatypeOssPassword=local-staging \
            --rerun-tasks --console=plain
          rm -f secring.gpg
      - name: Seal checked release bundle
        shell: bash
        run: |
          python3 .github/scripts/release_artifacts.py prepare \
            --state .release/source-state.json \
            --staging build/repo \
            --evidence build/release \
            --require-signatures
      - name: Upload checked release evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-evidence
          path: build/release
          if-no-files-found: error
          retention-days: 5
      - name: Upload artifacts-sha256
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: artifacts-sha256
          path: build/release/artifacts-sha256
          if-no-files-found: error
          retention-days: 5
      - name: Upload generated docs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-docs
          path: build/docs
          if-no-files-found: error
          retention-days: 5

  promote:
    needs: [finalize, verify]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout finalized source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.finalize.outputs.commit }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Download checked release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-evidence
          path: build/release
      - name: Promote the checked bytes to Maven Central
        shell: bash
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          python3 .github/scripts/release_artifacts.py promote \
            --state build/release/source-state.json \
            --evidence build/release \
            --publishing-type AUTOMATIC
      - name: Upload promotion receipt
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: promotion-receipt
          path: build/release/promotion-receipt.json
          if-no-files-found: warn
          retention-days: 30

  provenance-subject:
    needs: [promote]
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      artifacts-sha256: ${{ steps.set-hash.outputs.artifacts-sha256 }}
    steps:
      - name: Download artifacts-sha256
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts-sha256
      - name: Set artifacts-sha256 as output
        id: set-hash
        shell: bash
        run: echo "artifacts-sha256=$(<artifacts-sha256)" >> "$GITHUB_OUTPUT"

  provenance:
    needs: [promote, provenance-subject]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: "${{ needs.provenance-subject.outputs.artifacts-sha256 }}"
      upload-assets: true
      compile-generator: true

  release-completion:
    needs: [finalize, verify, promote, provenance]
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout finalized source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.finalize.outputs.commit }}
          token: ${{ secrets.GH_TOKEN }}
      - name: Download generated docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-docs
          path: build/docs
      - name: Export Gradle Properties
        uses: micronaut-projects/github-actions/export-gradle-properties@300bf6db7c062dcba77c90bb90e475df31b2acab # master
      - name: Determine latest release tag
        shell: bash
        run: |
          status=$(curl --silent --show-error --location \
            --output "$RUNNER_TEMP/latest-release.json" \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest")
          case "$status" in
            200) latest=$(jq -er '.tag_name' "$RUNNER_TEMP/latest-release.json") ;;
            404) latest='' ;;
            *)
              printf 'latest-release request failed with HTTP %s\n' "$status" >&2
              jq . "$RUNNER_TEMP/latest-release.json" >&2
              exit 1
              ;;
          esac
          echo "LATEST_TAG=$latest" >> "$GITHUB_ENV"
      - name: Publish to Github Pages
        uses: micronaut-projects/github-pages-deploy-action@76d63aafbab7108d74e83be4e5b3b0501382e829 # master
        env:
          BETA: ${{ !(github.event.release.tag_name == env.LATEST_TAG) || github.event.release.draft || github.event.release.prerelease || contains(needs.finalize.outputs.version, 'M') || contains(needs.finalize.outputs.version, 'RC') }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          BRANCH: gh-pages
          FOLDER: build/docs
          VERSION: ${{ needs.finalize.outputs.version }}
          TARGET_REPOSITORY: ${{ github.repository == 'micronaut-projects/micronaut-core' && env.docsRepository || github.repository }}
          DEVELOCITY_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
          DEVELOCITY_CACHE_USERNAME: ${{ secrets.GRADLE_ENTERPRISE_CACHE_USERNAME }}
          DEVELOCITY_CACHE_PASSWORD: ${{ secrets.GRADLE_ENTERPRISE_CACHE_PASSWORD }}
      - name: Run post-release
        uses: micronaut-projects/github-actions/post-release@300bf6db7c062dcba77c90bb90e475df31b2acab # master
        env:
          MICRONAUT_BUILD_EMAIL: ${{ secrets.MICRONAUT_BUILD_EMAIL }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  github_release:
    needs: [finalize, verify, promote, provenance]
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download checked release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-evidence
          path: build/release
      - name: Name the checked Central bundle for the GitHub release
        run: cp build/release/central-bundle.zip artifacts.zip
      - name: Upload assets
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          files: artifacts.zip
