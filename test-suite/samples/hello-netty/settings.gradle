/*
 * A standalone build. It is not part of the micronaut-runner build: the end-to-end tests and the
 * benchmark harness drive it with Gradle TestKit, passing runner.repo and runner.version so it resolves
 * the plugin from the aggregated local repository of -DUMMY publications.
 */
pluginManagement {
    repositories {
        maven { url = uri(providers.gradleProperty('runner.repo').get()) }
        gradlePluginPortal()
        mavenCentral()
        // The plugin's micronaut-aot 3.2.0-SNAPSHOT until the next micronaut-aot release (#263).
        maven {
            url = uri('https://central.sonatype.com/repository/maven-snapshots/')
            mavenContent {
                snapshotsOnly()
                includeGroup 'io.micronaut.aot'
            }
        }
    }
    plugins {
        id 'io.micronaut.runner.standalone' version providers.gradleProperty('runner.version').get()
    }
}

dependencyResolutionManagement {
    repositories {
        maven { url = uri(providers.gradleProperty('runner.repo').get()) }
        mavenCentral()
        // The catalog's micronaut-core 5.3.0-SNAPSHOT, which this sample is aligned to, until micronaut-core 5.3.0 is
        // released (#263).
        maven {
            url = uri('https://central.sonatype.com/repository/maven-snapshots/')
            mavenContent {
                snapshotsOnly()
                includeGroup 'io.micronaut'
            }
        }
    }
    versionCatalogs {
        libs {
            from(files('../../../gradle/libs.versions.toml'))
        }
    }
}

rootProject.name = 'hello-netty'
