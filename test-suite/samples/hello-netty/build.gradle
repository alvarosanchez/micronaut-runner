import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    alias(libs.plugins.micronaut.application)
    // Applied without a version: the version is pinned in settings.gradle.
    id 'io.micronaut.runner.standalone'
    // Only so the benchmark harness can compare against the format this one replaces.
    alias(libs.plugins.shadow)
}

version = '0.1'
group = 'com.example'

micronaut {
    version = libs.versions.micronaut.platform.get()
    runtime 'netty'
    processing {
        incremental true
        annotations 'com.example.*'
    }
    // The Runner plugin's options, where micronaut-gradle-plugin's own io.micronaut.runner reads them.
    // STORED is the default.
    runner {
        compression = 'STORED'
    }
}

dependencies {
    annotationProcessor 'io.micronaut:micronaut-inject-java'
    implementation 'io.micronaut:micronaut-http-server-netty'
    // Micronaut's HTTP server requires a JSON body provider even for a plain text endpoint, because the
    // default error response processor depends on one.
    annotationProcessor 'io.micronaut.serde:micronaut-serde-processor'
    implementation 'io.micronaut.serde:micronaut-serde-jackson'
    runtimeOnly 'ch.qos.logback:logback-classic'
}

application {
    mainClass = 'com.example.Application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// The runner jar takes the -all.jar name, because that is the name existing Dockerfiles and CI scripts
// already point at. The shaded jar is only here so the benchmark can compare the two formats over
// identical application bytes, so it is the one that moves aside.
tasks.named('shadowJar') {
    archiveClassifier = 'shadow'
}

// Benchmark control only: the shadowJar archive with uncompressed entries, so the startup harness can separate
// Runner's layout from the effect of not inflating. Shadow configures only the task named shadowJar, so this one
// copies its inputs, excludes, manifest and main class; the Micronaut plugin applies duplicate handling and
// service-file merging to every ShadowJar task. Registered lazily and not part of assemble.
def shadowJar = tasks.named('shadowJar', ShadowJar)
tasks.register('shadowJarStored', ShadowJar) { task ->
    task.group = 'benchmark'
    task.description = 'The shadowJar archive with STORED entries, for the startup benchmark control row'
    task.archiveClassifier = 'shadow-stored'
    task.entryCompression = ZipEntryCompression.STORED
    task.from(sourceSets.main.output)
    task.configurations.set(shadowJar.flatMap { it.configurations })
    task.mainClass.set(shadowJar.flatMap { it.mainClass })
    task.manifest.inheritFrom(shadowJar.get().manifest)
    task.exclude('META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA',
            'META-INF/versions/**/module-info.class', 'module-info.class')
}
