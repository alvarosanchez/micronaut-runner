pluginManagement {
    repositories {
        maven {
            url = uri(providers.gradleProperty('runner.repo').get())
            metadataSources { mavenPom() }
        }
        // runner-build's micronaut-aot-logback, which Maven Central serves.
        mavenCentral {
            content {
                includeGroup 'io.micronaut.aot'
            }
        }
    }
    plugins {
        id 'io.micronaut.runner.standalone' version providers.gradleProperty('runner.version').get()
    }
}

rootProject.name = 'published-marker-consumer'
