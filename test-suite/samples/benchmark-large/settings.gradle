/*
 * A standalone benchmark build. The harness passes runner.repo and runner.version so the plugin resolves
 * from the aggregated repository built from the exact revision under test.
 */
pluginManagement {
    repositories {
        maven { url = uri(providers.gradleProperty('runner.repo').get()) }
        gradlePluginPortal()
        mavenCentral()
        // runner-build's micronaut-aot-bytecode 3.2.0-SNAPSHOT, until 3.2.0 is released (#251).
        maven {
            url = uri('https://central.sonatype.com/repository/maven-snapshots/')
            mavenContent {
                snapshotsOnly()
                includeGroup 'io.micronaut.aot'
            }
        }
    }
    plugins {
        id 'io.micronaut.runner.standalone' version providers.gradleProperty('runner.version').get()
    }
}

dependencyResolutionManagement {
    repositories {
        maven { url = uri(providers.gradleProperty('runner.repo').get()) }
        mavenCentral()
    }
    versionCatalogs {
        libs {
            from(files('../../../gradle/libs.versions.toml'))
        }
    }
}

rootProject.name = 'benchmark-large'
