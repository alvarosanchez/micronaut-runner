dependencyResolutionManagement {
    repositories {
        maven {
            url = uri(providers.gradleProperty('runner.repo').get())
            metadataSources { gradleMetadata() }
        }
        // runner-build's micronaut-aot-logback, which Maven Central serves.
        mavenCentral {
            content {
                includeGroup 'io.micronaut.aot'
            }
        }
        // runner-build's micronaut-aot-logback 3.2.0-SNAPSHOT, until 3.2.0 is released (#248).
        maven {
            url = uri('https://central.sonatype.com/repository/maven-snapshots/')
            mavenContent {
                snapshotsOnly()
                includeGroup 'io.micronaut.aot'
            }
        }
    }
}

rootProject.name = 'published-module-metadata-consumer'
