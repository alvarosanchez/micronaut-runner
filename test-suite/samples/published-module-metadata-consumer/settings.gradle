dependencyResolutionManagement {
    repositories {
        maven {
            url = uri(providers.gradleProperty('runner.repo').get())
            metadataSources { gradleMetadata() }
        }
        // runner-build's micronaut-aot-bytecode and micronaut-aot-logback, which Maven Central serves.
        mavenCentral {
            content {
                includeGroup 'io.micronaut.aot'
            }
        }
    }
}

rootProject.name = 'published-module-metadata-consumer'
