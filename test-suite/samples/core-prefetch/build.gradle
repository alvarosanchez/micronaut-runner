plugins {
    alias(libs.plugins.micronaut.application)
    // Applied without a version: the version is pinned in settings.gradle.
    id 'io.micronaut.runner.standalone'
}

version = '0.1'
group = 'com.example'

micronaut {
    version = libs.versions.micronaut.platform.get()
    runtime 'netty'
    processing {
        incremental true
        annotations 'com.example.*'
    }
}

dependencies {
    annotationProcessor 'io.micronaut:micronaut-inject-java'
    implementation 'io.micronaut:micronaut-http-server-netty'
    // Micronaut's HTTP server requires a JSON body provider even for a plain text endpoint, because the
    // default error response processor depends on one.
    annotationProcessor 'io.micronaut.serde:micronaut-serde-processor'
    implementation 'io.micronaut.serde:micronaut-serde-jackson'
    runtimeOnly 'ch.qos.logback:logback-classic'
}

// What this sample is for: micronaut-core's own bean definition prefetch, which micronaut-core 5.3.0 is the first
// to have. Every module of the micronaut-core repository, the annotation processor included, is aligned to it. It
// is a snapshot until 5.3.0 is released, and only this sample uses it.
def micronautCore = '5.3.0-SNAPSHOT'
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'io.micronaut') {
            details.useVersion(micronautCore)
            details.because('the first micronaut-core with its own bean definition prefetch')
        }
    }
}

application {
    mainClass = 'com.example.Application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
