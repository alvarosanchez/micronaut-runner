/*
 * A standalone build: a Micronaut application whose Flyway migrations live in its own resources and in a
 * dependency, the subproject migrations. The end-to-end tests drive it with Gradle TestKit, passing runner.repo and
 * runner.version so it resolves the plugin from the aggregated local repository of -DUMMY publications.
 */
pluginManagement {
    repositories {
        maven { url = uri(providers.gradleProperty('runner.repo').get()) }
        gradlePluginPortal()
        mavenCentral()
    }
    plugins {
        id 'io.micronaut.runner.standalone' version providers.gradleProperty('runner.version').get()
    }
}

dependencyResolutionManagement {
    repositories {
        maven { url = uri(providers.gradleProperty('runner.repo').get()) }
        mavenCentral()
    }
    versionCatalogs {
        libs {
            from(files('../../../gradle/libs.versions.toml'))
        }
    }
}

rootProject.name = 'flyway'
include 'migrations'
