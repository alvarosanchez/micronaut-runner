plugins {
    id 'io.micronaut.build.internal.runner-testing'
}

description = 'End-to-end tests: builds the sample applications under samples/ with the -DUMMY plugins and runs them with java -jar'

dependencies {
    pluginsUnderTest project(path: ':micronaut-runner-launcher', configuration: 'repository')
    pluginsUnderTest project(path: ':micronaut-runner-build', configuration: 'repository')
    pluginsUnderTest project(path: ':micronaut-runner-gradle-plugin', configuration: 'repository')
    pluginsUnderTest project(path: ':micronaut-runner-maven-plugin', configuration: 'repository')

    testImplementation gradleTestKit()
    testImplementation libs.maven.invoker
}

tasks.withType(Test).configureEach {
    // Sample sources are inputs; their build outputs are not.
    inputs.files(fileTree('samples') { exclude '**/build/**', '**/.gradle/**', '**/target/**' })
          .withPathSensitivity(PathSensitivity.RELATIVE)
          .withPropertyName('samples')
    systemProperty 'runner.test.samplesDir', layout.projectDirectory.dir('samples').asFile.absolutePath
}

tasks.named('test', Test) {
    filter {
        excludeTestsMatching '*PublicationMetadataSmokeTest'
    }
}

/*
 * The production publications, not their -DUMMY twins: the root build publishes them into
 * build/publication-smoke-repo, and publicationSmokeTest inspects and consumes them. Only a release-shaped
 * version gives the file names and metadata users resolve from Maven Central, so a -SNAPSHOT is rejected.
 */
abstract class PublicationSmokeProvider implements CommandLineArgumentProvider {
    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getRepository()

    @Input
    abstract Property<String> getVersion()

    @Override
    Iterable<String> asArguments() {
        ["-Drunner.smoke.repo=${repository.singleFile.absolutePath}".toString(),
         "-Drunner.smoke.version=${version.get()}".toString()]
    }
}

tasks.register('publicationSmokeTest', Test) {
    description = 'Inspects and consumes the production publications with Gradle and strict Maven'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching '*PublicationMetadataSmokeTest'
    }
    // Both tasks build samples/hello-netty in place.
    mustRunAfter tasks.named('test')

    dependsOn ':micronaut-runner-launcher:publishMavenPublicationToPublicationSmokeRepository',
            ':micronaut-runner-build:publishMavenPublicationToPublicationSmokeRepository',
            ':micronaut-runner-gradle-plugin:publishPluginMavenPublicationToPublicationSmokeRepository',
            ':micronaut-runner-gradle-plugin:publishRunnerPluginMarkerMavenPublicationToPublicationSmokeRepository',
            ':micronaut-runner-maven-plugin:publishMavenPublicationToPublicationSmokeRepository',
            ':micronaut-runner-bom:publishMavenPublicationToPublicationSmokeRepository'
    def smoke = objects.newInstance(PublicationSmokeProvider)
    smoke.repository.from(rootProject.layout.buildDirectory.dir('publication-smoke-repo'))
    smoke.version.set(project.version.toString())
    jvmArgumentProviders.add(smoke)
    systemProperty 'runner.test.publicationSmokeDir',
            layout.buildDirectory.dir('publication-smoke').get().asFile.absolutePath
}

gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask("${project.path}:publicationSmokeTest".toString()) &&project.version.toString().endsWith('-SNAPSHOT')) {
        throw new GradleException("publicationSmokeTest needs a release-shaped version, not ${project.version}: "
                + 'a -SNAPSHOT publishes timestamped file names. Run it with '
                + '-PprojectVersion=1.0.0-PUBLICATION-SMOKE')
    }
}
