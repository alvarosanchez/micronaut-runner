plugins {
    id 'io.micronaut.build.internal.runner-testing'
    id 'me.champeau.jmh'
}

description = 'JMH micro-benchmarks for the launcher class loader and the end-to-end startup benchmark harness'

dependencies {
    jmh libs.jmh.core
    jmhAnnotationProcessor libs.jmh.generator.annprocess
    jmh projects.micronautRunnerLauncher
    jmh projects.micronautRunnerBuild

    implementation projects.micronautRunnerLauncher
    implementation projects.micronautRunnerBuild

    pluginsUnderTest project(path: ':micronaut-runner-launcher', configuration: 'repository')
    pluginsUnderTest project(path: ':micronaut-runner-build', configuration: 'repository')
    pluginsUnderTest project(path: ':micronaut-runner-gradle-plugin', configuration: 'repository')
}

// Any test that forks a CDS/AOT training JVM or a packaging worker tests the benchmark tool, not the product:
// tag it @Tag("benchmark-integration"). Tagged tests stay out of check; benchmarks.yml runs them first.
tasks.named('test', Test) {
    useJUnitPlatform { excludeTags 'benchmark-integration' }
}
def benchmarkIntegrationTest = tasks.register('benchmarkIntegrationTest', Test) {
    group = 'benchmark'
    description = 'Benchmark-tool tests that fork CDS/AOT training or packaging-worker JVMs'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'benchmark-integration' }
}

jmh {
    // ./gradlew :benchmarks:jmh -Pjmh.includes=ClassLoaderBenchmark ; everything when unset
    includes = providers.gradleProperty('jmh.includes').map { [it] }.getOrElse([])
    resultFormat = 'JSON'
    resultsFile = layout.buildDirectory.file('reports/jmh/results.json')
    duplicateClassesStrategy = DuplicatesStrategy.WARN
}

def benchmarkSample = providers.gradleProperty('benchmarks.sample').getOrElse('benchmark-large')
def startupBenchmark = tasks.register('startupBenchmark', JavaExec) {
    group = 'benchmark'
    description = 'Runs the end-to-end startup benchmark harness against the sample application'
    dependsOn tasks.named('prepareRepository')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.micronaut.runner.benchmarks.StartupBenchmark'
    def outDir = layout.buildDirectory.dir('reports/startup')
    outputs.dir(outDir)
    // A measurement is never up to date. The arguments below are supplied by a CommandLineArgumentProvider
    // that declares no inputs, so without this Gradle would consider a second run with a different
    // -Pbenchmarks.iterations to be the same work and skip it, silently leaving yesterday's summary.md in
    // place for CI to publish.
    outputs.upToDateWhen { false }
    // Source identity must be explicit: user.dir may belong to an unrelated checkout for direct CLI runs.
    systemProperty 'runner.benchmark.sourceRoot', rootProject.layout.projectDirectory.asFile.absolutePath
    argumentProviders.add({ ->
        def arguments = [
                '--sample', rootProject.layout.projectDirectory.dir("test-suite/samples/${benchmarkSample}").asFile.absolutePath,
                '--repo', layout.buildDirectory.dir('aggregated-repo').get().asFile.toURI().toASCIIString(),
                '--version', providers.gradleProperty('projectVersion').get().replace('-SNAPSHOT', '-DUMMY'),
                '--iterations', providers.gradleProperty('benchmarks.iterations').getOrElse('10'),
                '--out', outDir.get().asFile.absolutePath,
                // Built variants and trained caches are build output, not reports: keep them out of reports/.
                '--work', layout.buildDirectory.dir('tmp/startupBenchmark').get().asFile.absolutePath]
        if (providers.gradleProperty('benchmarks.allowPartial').map(String::toBoolean).getOrElse(false)) {
            arguments.add('--allow-partial')
        }
        if (providers.gradleProperty('benchmarks.diagnostics').map(String::toBoolean).getOrElse(false)) {
            arguments.add('--diagnostics')
        }
        arguments
    } as CommandLineArgumentProvider)
}

tasks.register('packagingProfile', JavaExec) {
    group = 'benchmark'
    description = 'Profiles deterministic clean and edit-cycle packaging workloads'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.micronaut.runner.benchmarks.PackagingProfile'
    def outDir = layout.buildDirectory.dir('reports/packaging')
    outputs.dir(outDir)
    outputs.upToDateWhen { false }
    systemProperty 'runner.benchmark.sourceRoot', rootProject.layout.projectDirectory.asFile.absolutePath
    argumentProviders.add({ -> [
            '--workloads', providers.gradleProperty('benchmarks.workloads').getOrElse('small,representative,wide'),
            '--iterations', providers.gradleProperty('benchmarks.packagingIterations').getOrElse('3'),
            '--out', outDir.get().asFile.absolutePath
    ] } as CommandLineArgumentProvider)
}

// org.gradle.parallel=true: never let forked test JVMs overlap a measurement
['jmh', 'packagingProfile', 'startupBenchmark'].each { name ->
    tasks.named(name) { mustRunAfter benchmarkIntegrationTest }
}

// Same exclusions as micronaut-core/benchmarks
['spotlessJavaCheck', 'checkstyleMain', 'checkstyleJmh'].each { name ->
    tasks.matching { it.name == name }.configureEach { enabled = false }
}
