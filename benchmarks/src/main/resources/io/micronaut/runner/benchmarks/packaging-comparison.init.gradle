/*
 * Applied with --init-script by PackagingComparison to its copy of benchmark-large.
 *
 * -PpackagingComparison.compression=<mode> sets micronautRunnerJar's compression and names its archive
 * all-<mode>, so each Runner variant keeps its own file. The value is passed through: the task validates it.
 *
 * Each timed task prints one line after its last action, with the time since its first action:
 *   PACKAGING_TASK <task path> <milliseconds> <absolute archive path>
 * A task that does not execute (UP-TO-DATE, FROM-CACHE) prints nothing, and the harness fails the run.
 */
def timed = ['micronautRunnerJar', 'shadowJar', 'shadowJarStored']
gradle.rootProject { project ->
    def compression = project.providers.gradleProperty('packagingComparison.compression').orNull
    if (compression != null) {
        // configureEach runs before the sample registers its tasks and configures them when they are realized.
        project.tasks.configureEach { task ->
            if (task.name == 'micronautRunnerJar') {
                task.compression = compression
                task.archiveClassifier = "all-${compression.toLowerCase(Locale.ROOT)}"
            }
        }
    }
}
// Added once the graph is final, so the markers enclose every action the build gave the task.
gradle.taskGraph.whenReady { graph ->
    graph.allTasks.findAll { it.name in timed }.each { task ->
        long start = 0
        task.doFirst { start = System.nanoTime() }
        task.doLast {
            def millis = String.format(Locale.ROOT, '%.3f', (System.nanoTime() - start) / 1_000_000d)
            println "PACKAGING_TASK ${task.path} ${millis} ${task.archiveFile.get().asFile.absolutePath}"
        }
    }
}
