plugins {
    id "io.micronaut.build.internal.parent"
}

// micronaut-aot 3.2.0-SNAPSHOT, which runner-build depends on, until the next micronaut-aot release, and the catalog's
// micronaut-core 5.3.0-SNAPSHOT, which the service index needs, until micronaut-core 5.3.0 is released (#263): for the
// projects that resolve runner-build or micronaut-core and for the aggregated Javadoc of this one.
allprojects {
    repositories {
        maven {
            url = uri('https://central.sonatype.com/repository/maven-snapshots/')
            mavenContent {
                snapshotsOnly()
                includeGroup 'io.micronaut.aot'
                includeGroup 'io.micronaut'
            }
        }
    }
}

// The production publications, published on demand for :test-suite:publicationSmokeTest. Registered here
// rather than in runner-test-repo because runner-bom does not apply that convention; its onlyIf already keeps
// the -DUMMY twins out of every repository but testRepo.
def publicationSmokeRepo = layout.buildDirectory.dir('publication-smoke-repo')
def cleanPublicationSmokeRepo = tasks.register('cleanPublicationSmokeRepo', Delete) {
    delete publicationSmokeRepo
}
subprojects { p ->
    p.pluginManager.withPlugin('maven-publish') {
        p.extensions.getByType(PublishingExtension).repositories.maven {
            name = 'publicationSmoke'
            url = publicationSmokeRepo
        }
        p.tasks.withType(PublishToMavenRepository)
                .matching { it.name.endsWith('ToPublicationSmokeRepository') }
                .configureEach { dependsOn cleanPublicationSmokeRepo }
    }
}
